<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiendaWeb · Registro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="contenedor barra">
      <a class="logo" href="index.html">TiendaWeb</a>
      <button class="menu-toggle" data-nav-toggle aria-expanded="false" aria-controls="menu-principal" type="button">☰ Menú</button>
      <nav class="menu" aria-label="Navegación principal">
        <ul id="menu-principal">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="registro.html" class="activo">Registro</a></li>
          <li><a href="quienes-somos.html">Quiénes somos</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="carrito.html">Carrito (<span id="contador-carrito">0</span>)</a></li>
          <li><a href="busqueda.html">Búsqueda</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    <p class="eyebrow">Sección 2</p>
    <h1>Registro de usuario</h1>
    <p class="lead">Crea tu cuenta para recibir promociones y novedades.</p>

    <form id="form-registro" action="#" method="post">

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Pérez López">
      </div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com"
               pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}"
               title="Escribe un correo válido, por ejemplo: usuario@dominio.com">
        <p class="ayuda">Formato: usuario@dominio.com</p>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password">
      </div>

      <div class="campo">
        <label for="nacimiento">Fecha de nacimiento</label>
        <input type="date" id="nacimiento" name="nacimiento">
      </div>

      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="10 dígitos"
               pattern="[0-9]{10}" title="Escribe 10 dígitos, sin espacios ni guiones">
      </div>

      <div class="campo campo-check">
        <input type="checkbox" id="terminos" name="terminos">
        <label for="terminos">Acepto los términos y condiciones</label>
      </div>

      <button type="submit" id="btn-enviar" disabled>Registrarme</button>

      <p id="mensaje-registro" class="oculto" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <p>
        Proyecto de Unidad · TiendaWeb ·
        <a href="https://github.com/" target="_blank" rel="noopener">Repositorio en GitHub</a>
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
